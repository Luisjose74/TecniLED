<!--
  BOTÓN FLOTANTE DE ACCESIBILIDAD (abajo a la derecha)
  Opciones: modo oscuro, tamaño de letra y alto contraste.
  Las funciones están en static/js/main.js y se guardan en localStorage
  para que la preferencia se mantenga al cambiar de página.
-->
<div id="accesibilidad" class="fixed right-5 bottom-6 z-50 flex flex-col items-end gap-3">

  <!-- Panel de opciones (oculto hasta que se toca el botón) -->
  <div id="panel-accesibilidad" class="hidden bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-100 dark:border-gray-700 p-4 w-60 mb-1">
    <p class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-3">Accesibilidad</p>

    <!-- Modo oscuro / claro -->
    <button type="button" onclick="cambiarTema()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors text-left">
      <div class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center shrink-0">
        <!-- Luna (se ve en modo claro) -->
        <svg aria-hidden="true" class="w-4 h-4 text-gray-500 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <!-- Sol (se ve en modo oscuro) -->
        <svg aria-hidden="true" class="w-4 h-4 text-[#F2AE30] hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </div>
      <div>
        <p class="text-sm font-semibold text-gray-800 dark:text-gray-200"><span class="dark:hidden">Modo oscuro</span><span class="hidden dark:inline">Modo claro</span></p>
        <p class="text-[10px] text-gray-400">Cambiar el tema de la página</p>
      </div>
    </button>

    <!-- Tamaño de letra -->
    <div class="flex items-center gap-3 px-3 py-2.5">
      <div class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center shrink-0">
        <svg aria-hidden="true" class="w-4 h-4 text-gray-500 dark:text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"/><path d="M9 20h6"/></svg>
      </div>
      <div class="flex-1">
        <p class="text-sm font-semibold text-gray-800 dark:text-gray-200 mb-1">Tamaño de texto</p>
        <div class="flex items-center gap-2">
          <button type="button" onclick="cambiarTamanoLetra(-10)" aria-label="Reducir letra" class="w-7 h-7 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-[#F2AE30]/20 font-bold text-gray-600 dark:text-gray-300 transition-colors">−</button>
          <span id="texto-tamano-letra" class="flex-1 text-center text-xs font-bold text-gray-600 dark:text-gray-300">100%</span>
          <button type="button" onclick="cambiarTamanoLetra(10)" aria-label="Aumentar letra" class="w-7 h-7 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-[#F2AE30]/20 font-bold text-gray-600 dark:text-gray-300 transition-colors">+</button>
        </div>
      </div>
    </div>

    <!-- Alto contraste -->
    <button type="button" onclick="cambiarContraste()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors text-left">
      <div class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center shrink-0">
        <svg aria-hidden="true" class="w-4 h-4 text-gray-500 dark:text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 18a6 6 0 0 0 0-12v12z"/></svg>
      </div>
      <div>
        <p class="text-sm font-semibold text-gray-800 dark:text-gray-200">Alto contraste</p>
        <p class="text-[10px] text-gray-400">Aumentar contraste visual</p>
      </div>
    </button>

    <button type="button" onclick="restablecerAccesibilidad()" class="w-full mt-1 text-xs text-center text-gray-400 hover:text-[#F2AE30] py-1.5 transition-colors">
      Restablecer
    </button>
  </div>

  <!-- Botón redondo que abre/cierra el panel -->
  <button type="button" id="boton-accesibilidad" onclick="toggleAccesibilidad()" title="Accesibilidad" aria-label="Opciones de accesibilidad"
    class="w-14 h-14 rounded-2xl shadow-lg flex items-center justify-center bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:border-[#F2AE30] hover:text-[#F2AE30] hover:scale-105 transition-all">
    <svg aria-hidden="true" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="4" r="1"/><path d="m18 19 1-7-6 1"/><path d="m5 8 3-3 5.5 3-2.36 3.5"/><path d="M4.24 14.5a5 5 0 0 0 6.88 6"/><path d="M13.76 17.5a5 5 0 0 0-6.88-6"/></svg>
  </button>

  <!-- Botón de Ayuda (G1-1197): lleva al módulo de preguntas frecuentes -->
  <a href="{% url 'ayuda' %}" title="Ayuda" aria-label="Ir a la ayuda y preguntas frecuentes"
    class="w-14 h-14 rounded-2xl shadow-lg flex items-center justify-center bg-[#F2AE30] text-gray-900 border border-[#F2AE30] hover:bg-[#d99b28] hover:scale-105 transition-all">
    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
  </a>

</div>
